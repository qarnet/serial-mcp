# Historical MCP client interoperability fixture.
#
# Standalone package, not a root workspace member. Compiled against exact
# pre-migration rmcp 1.7.0 so the current serial-mcp server can be exercised
# by a real historical client over HTTP and stdio. Owns a committed Cargo.lock
# and is built with --locked. Policy drift guard (tests/doc_drift.rs)
# enforces the pinned rmcp 1.7.0 entry and historical checksum.
#
# Never published.

[package]
name = "rmcp-1-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exact pin. Compatibility depends on the historical client implementation,
# not current rmcp resolution. `client` and the two transports are the complete
# fixture surface; default-features = false excludes server/macros features and
# prevents drift into current SDK behavior.
rmcp = { version = "=1.7.0", default-features = false, features = [
  "client",
  "transport-child-process",
  "transport-streamable-http-client-reqwest",
] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "time",
  "process",
] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
