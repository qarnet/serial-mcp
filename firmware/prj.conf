#
# Kconfig for the native_sim test firmware.
#
# Enable serial support, interrupt-driven UART, line control, and ring buffering.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

# Provide hardware and build information for the `info` command.
CONFIG_HWINFO=y

# Send logs to the system logger instead of the command channel.
CONFIG_LOG=y

# Keep Zephyr shell traffic off the UART.
# boards/native_sim.conf sets CONFIG_CONSOLE=y because native_sim's
# POSIX_ARCH_CONSOLE requires it.
CONFIG_UART_CONSOLE=n
