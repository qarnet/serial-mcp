#
# Kconfig fragment for the native_sim board.
# west build -b native_sim firmware/ applies this fragment automatically.
#
# The board provides the chosen Zephyr console and auto-enables
# CONFIG_UART_NATIVE_PTY because that console uses the
# "zephyr,native-pty-uart" compatible. This file selects the PTY mode for
# automated testing and disables console features that could steal command
# channel bytes.

# Connect the chosen console UART to its own dedicated pseudo-terminal
# (default). NativeSimFirmware::spawn reads the
# "uart connected to pseudotty: /dev/pts/N" line from stdout to find the
# PTY path. ON_OWN_PTY keeps logs and the command channel on separate streams.
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y

# Prevent Kconfig.defconfig from auto-enabling UART_CONSOLE when both
# CONSOLE=y and SERIAL=y. The Zephyr console must not use the command UART,
# because it would emit prompts and consume command bytes.
# prj.conf disables UART_CONSOLE and leaves CONSOLE unset. The native_sim
# board unconditionally selects POSIX_ARCH_CONSOLE, which requires CONSOLE=y,
# so set it here. POSIX_ARCH_CONSOLE sends printk output to the host terminal,
# not the PTY, and does not interfere with the command channel.
CONFIG_CONSOLE=y

# Keep UART_CONSOLE off so the Zephyr shell cannot use the PTY or steal
# command-channel bytes.
CONFIG_UART_CONSOLE=n
