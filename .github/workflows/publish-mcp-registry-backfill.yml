name: Publish to MCP Registry (backfill)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict SemVer version to backfill; it must already have a published GitHub release v<version>
        required: true
        type: string

# Read-only plus OIDC. No repository write credential or secrets.
permissions:
  contents: read
  id-token: write

jobs:
  backfill:
    name: Backfill registry publication
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ inputs.version }}
