name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The build produces ~4-5 GB of store paths (593 cargo deps + the
          # serial-mcp crate + toolchain + system libs). The previous 2G cap
          # evicted the deps/crate artifacts between runs, forcing a full
          # ~14 min rebuild every run even on cache hits. 8G lets the cache
          # retain the build outputs so subsequent runs substitute instead
          # of recompiling. Trade-off: larger GitHub Actions cache storage
          # (billed against the repo's 10 GB per-repo cache quota).
          gc-max-store-size-linux: 8G

      # --print-build-logs (-L) streams cargo/compiler output so the build
      # phase is visible in the job log instead of a silent multi-minute
      # gap. Essential for debugging flake/build failures.
      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

  build-test:
    name: build / test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          - os: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          # GitHub Actions uses macOS version labels here; macos-14 is Apple Silicon.
          - os: macos-14
            install: ""
          - os: windows-latest
            install: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --all-targets
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate example configs against vendored schemas
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test config_schema_validation

      - name: Validate release and documentation consistency
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test doc_drift

  mcp-conformance:
    # Pinned official MCP conformance suite + Inspector interoperability smoke
    # against the real HTTP binary, plus the historical rmcp 1.7.0 client gate.
    # Execution delegates to scripts/test-mcp-compat.sh so local and CI share
    # ONE executable path: the script owns the exact pinned package
    # (@modelcontextprotocol/conformance@0.2.0-alpha.10, no floating tags),
    # the exact scenario sets at their exact protocol versions (never
    # `--suite all`), the expected-failure baseline, and the pinned Inspector
    # invocation. The four expected failures in
    # conformance/expected-failures.yaml are fixture-dependent checks
    # serial-mcp deliberately cannot satisfy (no fixture endpoints are ever
    # added to the product). A baseline entry that starts passing fails the
    # job as stale; any other failure is an unexpected regression.
    # Inspector is interoperability (NOT conformance): a separate smoke that
    # drives the exact pinned @modelcontextprotocol/inspector@2.0.0 CLI.
    # This job only owns environment setup, the 15-minute bound, cleanup, and
    # report upload.
    name: MCP conformance + Inspector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Setup Node (exact pinned version)
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      # The shared runner builds the locked binary, runs the focused Rust
      # gates, builds + runs the historical rmcp 1.7.0 client over stdio and
      # HTTP, starts the loopback server with a bounded readiness probe, runs
      # the exact legacy/modern conformance scenario sets, and runs the
      # Inspector smoke. It stops the server and cleans its own temp dir via
      # a trap on success, failure, signal, or timeout.
      - name: Run shared MCP compatibility gate
        run: bash scripts/test-mcp-compat.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results
          path: target/conformance-results/
          if-no-files-found: warn
          retention-days: 7

  native-sim:
    name: native_sim firmware + test
    runs-on: ubuntu-latest
    env:
      NCS_VERSION: v3.3.0
      NCS_INSTALL_DIR: /home/runner/ncs
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GitHub-hosted ubuntu-latest runners ship ~14 GB free disk. The NCS
      # SDK + toolchain cache alone is ~4.6 GB, cargo cache ~1-2 GB, and the
      # runner image preinstalls ~7 GB of toolchains we never use (dotnet,
      # android, ghc, CodeQL, docker images). Without reclaiming that headroom
      # the native-sim job intermittently hits ENOSPC — the runner can't even
      # write its own _diag log (System.IO.IOException: No space left on
      # device). This step reclaims ~7 GB. DO NOT remove without measuring
      # free disk with the df -h steps below. See firmware/AGENTS.md
      # "CI disk pressure" for the full rationale.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config gcc-multilib libusb-1.0-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Cache NCS SDK and toolchain
        id: cache-ncs
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-v3

      - name: Download nrfutil
        run: |
          curl -L -o nrfutil https://files.nordicsemi.com/artifactory/swtools/external/nrfutil/executables/x86_64-unknown-linux-gnu/nrfutil
          chmod +x nrfutil
          sudo mv nrfutil /usr/local/bin/

      - name: Bootstrap nrfutil core module
        run: nrfutil self-upgrade

      - name: Install sdk-manager command
        run: nrfutil install sdk-manager

      - name: Configure sdk-manager install directory
        run: nrfutil sdk-manager config install-dir set "$NCS_INSTALL_DIR"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "$NCS_VERSION"

      - name: Report disk usage after NCS restore/install
        run: df -h /

      - name: Build native_sim firmware
        run: |
          eval "$(nrfutil sdk-manager toolchain env --ncs-version "$NCS_VERSION" --as-script sh)"
          export ZEPHYR_BASE="$NCS_INSTALL_DIR/$NCS_VERSION/zephyr"
          west build -b native_sim firmware/ -d build/native_sim --pristine -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Report disk usage after firmware build
        run: df -h /

      - name: Run native_sim tests
        env:
          SERIAL_MCP_NATIVE_SIM_BIN: build/native_sim/firmware/zephyr/zephyr.exe
        run: |
          cargo test --test native_sim_validation -- --ignored --test-threads=1
          cargo test --test native_sim_connection_lifecycle -- --ignored --test-threads=1

      # Remove the firmware build tree after tests so the post-step cache
      # upload (and any later steps) don't walk a stale build dir. The NCS
      # cache at /home/runner/ncs is intentionally kept — actions/cache@v6
      # saves it post-job and a cache miss + skipped install would break the
      # next run. DO NOT rm -rf /home/runner/ncs.
      - name: Clean firmware build tree
        if: always()
        run: rm -rf build/native_sim

      - name: Run HTTP integration tests (spawned binary)
        run: cargo test --test http_integration --locked -- --test-threads=1
