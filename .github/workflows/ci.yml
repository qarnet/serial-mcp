name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The build produces ~4-5 GB of store paths (593 cargo deps + the
          # serial-mcp crate + toolchain + system libs). The previous 2G cap
          # evicted the deps/crate artifacts between runs, forcing a full
          # ~14 min rebuild every run even on cache hits. 8G lets the cache
          # retain the build outputs so subsequent runs substitute instead
          # of recompiling. Trade-off: larger GitHub Actions cache storage
          # (billed against the repo's 10 GB per-repo cache quota).
          gc-max-store-size-linux: 8G

      # --print-build-logs (-L) streams cargo/compiler output so the build
      # phase is visible in the job log instead of a silent multi-minute
      # gap. Essential for debugging flake/build failures.
      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

  build-test:
    name: build / test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          - os: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          # GitHub Actions uses macOS version labels here; macos-14 is Apple Silicon.
          - os: macos-14
            install: ""
          - os: windows-latest
            install: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --all-targets
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --locked

      # Required Rust PTY replacement evidence. Linux executes all real-PTY
      # targets plus the bounded 100-iteration Phase E gate; macOS executes
      # the fixture/command/framing boundary targets and naturally has zero
      # Linux-only protocol cases. Windows retains compile + controlled-backend
      # coverage only because no real COM fixture exists there.
      - name: Run required Rust PTY replacement suites
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-14'
        run: |
          cargo test --locked --test device_fixture -- --test-threads=1
          cargo test --locked --test device_command_parity -- --test-threads=1
          cargo test --locked --test device_framing_parity -- --test-threads=1
          cargo test --locked --test device_protocol_parity -- --test-threads=1
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cargo test --locked --test device_parity_repeat phase_e_public_boundary_repeat_gate -- --ignored --test-threads=1
          fi

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate example configs against vendored schemas
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test config_schema_validation

      - name: Validate release and documentation consistency
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test doc_drift

      - name: Run registry manifest builder tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s scripts/tests -v

  mcp-conformance:
    # Pinned official MCP conformance suite + Inspector interoperability smoke
    # against the real HTTP binary, plus the historical rmcp 1.7.0 client gate.
    # Execution delegates to scripts/test-mcp-compat.sh so local and CI share
    # ONE executable path: the script installs the lockfile-pinned validation
    # tree (compat/mcp-validation/package-lock.json — exact
    # @modelcontextprotocol/conformance@0.2.0-alpha.10 and
    # @modelcontextprotocol/inspector@2.0.0 with integrity hashes) via
    # `npm ci --ignore-scripts` (lifecycle scripts disabled, no npx, no
    # dynamic package resolution) and invokes the local node_modules/.bin
    # binaries directly. The script also owns the exact scenario sets at their
    # exact protocol versions (never `--suite all`), the expected-failure
    # baseline, and the pinned Inspector invocation. The four expected
    # failures in conformance/expected-failures.yaml are fixture-dependent
    # checks serial-mcp deliberately cannot satisfy (no fixture endpoints are
    # ever added to the product). A baseline entry that starts passing fails
    # the job as stale; any other failure is an unexpected regression.
    # Inspector is interoperability (NOT conformance): a separate smoke that
    # drives the exact pinned @modelcontextprotocol/inspector@2.0.0 CLI.
    # This job only owns environment setup, the 15-minute bound, cleanup, and
    # report upload.
    name: MCP conformance + Inspector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node (exact pinned version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      # The shared runner installs the lockfile-pinned MCP validation tooling
      # (`npm ci --ignore-scripts` in compat/mcp-validation, lifecycle scripts
      # disabled — no npx, no dynamic resolution), builds the locked binary,
      # runs the focused Rust gates, builds + runs the historical rmcp 1.7.0
      # client over stdio and HTTP, starts the loopback server with a bounded
      # readiness probe, runs the exact legacy/modern conformance scenario
      # sets via the local conformance binary, and runs the Inspector smoke
      # via the local mcp-inspector binary. It stops the server and cleans its
      # own temp dir via a trap on success, failure, signal, or timeout.
      - name: Run shared MCP compatibility gate
        run: bash scripts/test-mcp-compat.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results
          path: target/conformance-results/
          if-no-files-found: warn
          retention-days: 7
  release:
    name: Release
    needs: [nix-flake, build-test]
    # Only a trusted push to main may reach the privileged release call. Pull
    # requests and other refs skip it, so PR-contributed content can never
    # trigger a publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      mode: release
      ref: ${{ github.sha }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: release
    # Same trusted gate as the release job; runs only after release succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.version }}

  notify-release-failure:
    name: Notify release pipeline failure
    needs: [release, publish-mcp-registry]
    # Runs on trusted main push only, after the release chain, whenever either
    # privileged call failed. always() keeps it alive when a dependency fails.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.release.result == 'failure' || needs.publish-mcp-registry.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          REGISTRY_RESULT: ${{ needs.publish-mcp-registry.result }}
        run: |
          set -euo pipefail
          # One stable issue per failure lineage: comment on the open
          # "[automation] Release pipeline failed" issue or create it. There is
          # no checkout, so GH_REPO pins the repository for gh. All dynamic
          # values arrive via env, never interpolated into the source.
          BODY="Release pipeline failed in run ${RUN_URL} at commit ${SHA}. release=${RELEASE_RESULT}, registry=${REGISTRY_RESULT}."
          OPEN=$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq 'map(select(.title == "[automation] Release pipeline failed"))[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "[automation] Release pipeline failed" --body "$BODY"
          fi
