name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The build produces ~4-5 GB of store paths (593 cargo deps + the
          # serial-mcp crate + toolchain + system libs). The previous 2G cap
          # evicted the deps/crate artifacts between runs, forcing a full
          # ~14 min rebuild every run even on cache hits. 8G lets the cache
          # retain the build outputs so subsequent runs substitute instead
          # of recompiling. Trade-off: larger GitHub Actions cache storage
          # (billed against the repo's 10 GB per-repo cache quota).
          gc-max-store-size-linux: 8G

      # --print-build-logs (-L) streams cargo/compiler output so the build
      # phase is visible in the job log instead of a silent multi-minute
      # gap. Essential for debugging flake/build failures.
      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

  build-test:
    name: build / test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          - os: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          # GitHub Actions uses macOS version labels here; macos-14 is Apple Silicon.
          - os: macos-14
            install: ""
          - os: windows-latest
            install: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --all-targets
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate example configs against vendored schemas
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test config_schema_validation

      - name: Validate release and documentation consistency
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test doc_drift

      - name: Run registry manifest builder tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s scripts/tests -v

  mcp-conformance:
    # Pinned official MCP conformance suite + Inspector interoperability smoke
    # against the real HTTP binary, plus the historical rmcp 1.7.0 client gate.
    # Execution delegates to scripts/test-mcp-compat.sh so local and CI share
    # ONE executable path: the script owns the exact pinned package
    # (@modelcontextprotocol/conformance@0.2.0-alpha.10, no floating tags),
    # the exact scenario sets at their exact protocol versions (never
    # `--suite all`), the expected-failure baseline, and the pinned Inspector
    # invocation. The four expected failures in
    # conformance/expected-failures.yaml are fixture-dependent checks
    # serial-mcp deliberately cannot satisfy (no fixture endpoints are ever
    # added to the product). A baseline entry that starts passing fails the
    # job as stale; any other failure is an unexpected regression.
    # Inspector is interoperability (NOT conformance): a separate smoke that
    # drives the exact pinned @modelcontextprotocol/inspector@2.0.0 CLI.
    # This job only owns environment setup, the 15-minute bound, cleanup, and
    # report upload.
    name: MCP conformance + Inspector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node (exact pinned version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      # The shared runner builds the locked binary, runs the focused Rust
      # gates, builds + runs the historical rmcp 1.7.0 client over stdio and
      # HTTP, starts the loopback server with a bounded readiness probe, runs
      # the exact legacy/modern conformance scenario sets, and runs the
      # Inspector smoke. It stops the server and cleans its own temp dir via
      # a trap on success, failure, signal, or timeout.
      - name: Run shared MCP compatibility gate
        run: bash scripts/test-mcp-compat.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results
          path: target/conformance-results/
          if-no-files-found: warn
          retention-days: 7
  native-sim:
    name: native_sim firmware + test
    runs-on: ubuntu-latest
    env:
      NCS_VERSION: v3.3.0
      NCS_INSTALL_DIR: /home/runner/ncs
      # Pinned nrfutil core + sdk-manager packages, visible update points for
      # the provisioning step. The installer downloads these exact versioned
      # tarballs only and verifies their SHA-256 before extraction — never
      # the unversioned launcher URL that returned an HTTP 504 HTML page and
      # broke every later nrfutil step. See firmware/AGENTS.md "CI nrfutil
      # provisioning" for the update procedure.
      NRFUTIL_VERSION: "8.2.0"
      NRFUTIL_SHA256: "fabe84198efe045a7cdcc9d5132669c1bc2cb168f61db93f2261ae4fd980e73f"
      NRFUTIL_SDK_MANAGER_VERSION: "1.16.1"
      NRFUTIL_SDK_MANAGER_SHA256: "d2fe97f143f888a679223d9c6e0b51d730eb60b4a5f4a5dafc970acd2020fe38"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub-hosted ubuntu-latest runners ship ~14 GB free disk. The NCS
      # SDK + toolchain cache alone is ~4.6 GB, cargo cache ~1-2 GB, and the
      # runner image preinstalls ~7 GB of toolchains we never use (dotnet,
      # android, ghc, CodeQL, docker images). Without reclaiming that headroom
      # the native-sim job intermittently hits ENOSPC — the runner can't even
      # write its own _diag log (System.IO.IOException: No space left on
      # device). This step reclaims ~7 GB. DO NOT remove without measuring
      # free disk with the df -h steps below. See firmware/AGENTS.md
      # "CI disk pressure" for the full rationale.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config gcc-multilib libusb-1.0-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cache NCS SDK and toolchain
        id: cache-ncs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-v3

      # Fail-closed, checksum-verified, version-pinned provisioning. The old
      # flow curl'd an unversioned launcher into /usr/local/bin (which
      # silently installed a 160-byte HTTP 504 HTML page when Nordic's CDN
      # timed out) and then floated the core module and sdk-manager through
      # `nrfutil self-upgrade` / `nrfutil install sdk-manager` on every run.
      # scripts/install-nrfutil-ci.sh downloads the exact versioned tarballs
      # pinned in the job env, verifies SHA-256 before extraction, stages and
      # verifies both binaries, and only then publishes the destination — no
      # sudo, nothing executed before verification, temp cleaned on failure.
      # The offline tests in scripts/tests/test_install_nrfutil_ci.sh exercise
      # this pipeline deterministically (file:// fixtures, no network).
      - name: Run installer offline tests
        run: bash scripts/tests/test_install_nrfutil_ci.sh

      - name: Provision pinned nrfutil + sdk-manager
        run: |
          bash scripts/install-nrfutil-ci.sh "$RUNNER_TEMP/nrfutil"
          # Isolated NRFUTIL_HOME: stale command registrations restored from
          # the actions/cache entry (path /home/runner/.nrfutil) can never
          # override the pinned binaries. GITHUB_PATH/GITHUB_ENV only affect
          # later steps, which is exactly what the next steps need.
          mkdir -p "$RUNNER_TEMP/nrfutil-home"
          echo "$RUNNER_TEMP/nrfutil/bin" >> "$GITHUB_PATH"
          echo "NRFUTIL_HOME=$RUNNER_TEMP/nrfutil-home" >> "$GITHUB_ENV"

      # Version token on the first line proves the binaries every later step
      # will use. The first line carries a per-build hash suffix
      # ("nrfutil 8.2.0 (c910332 2026-04-21)"), so the check is a prefix match
      # on the pinned version, not a full-line equality. NRFUTIL_HOME
      # isolation (set above) keeps cached ~/.nrfutil registrations from
      # shadowing these.
      - name: Verify pinned nrfutil + sdk-manager versions
        run: |
          set -euo pipefail
          case "$(nrfutil --version | head -n1)" in
            "nrfutil $NRFUTIL_VERSION "*) ;;
            "nrfutil $NRFUTIL_VERSION") ;;
            *) echo "unexpected nrfutil version: $(nrfutil --version | head -n1)" >&2; exit 1 ;;
          esac
          case "$(nrfutil-sdk-manager --version | head -n1)" in
            "nrfutil-sdk-manager $NRFUTIL_SDK_MANAGER_VERSION "*) ;;
            "nrfutil-sdk-manager $NRFUTIL_SDK_MANAGER_VERSION") ;;
            *) echo "unexpected nrfutil-sdk-manager version: $(nrfutil-sdk-manager --version | head -n1)" >&2; exit 1 ;;
          esac

      - name: Configure sdk-manager install directory
        run: nrfutil sdk-manager config install-dir set "$NCS_INSTALL_DIR"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "$NCS_VERSION"

      - name: Report disk usage after NCS restore/install
        run: df -h /

      - name: Build native_sim firmware
        run: |
          eval "$(nrfutil sdk-manager toolchain env --ncs-version "$NCS_VERSION" --as-script sh)"
          export ZEPHYR_BASE="$NCS_INSTALL_DIR/$NCS_VERSION/zephyr"
          west build -b native_sim firmware/ -d build/native_sim --pristine -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Report disk usage after firmware build
        run: df -h /

      - name: Run native_sim tests
        env:
          SERIAL_MCP_NATIVE_SIM_BIN: build/native_sim/firmware/zephyr/zephyr.exe
        run: |
          cargo test --test native_sim_validation -- --ignored --test-threads=1
          cargo test --test native_sim_connection_lifecycle -- --ignored --test-threads=1

      # Remove the firmware build tree after tests so the post-step cache
      # upload (and any later steps) don't walk a stale build dir. The NCS
      # cache at /home/runner/ncs is intentionally kept — actions/cache@v6
      # saves it post-job and a cache miss + skipped install would break the
      # next run. DO NOT rm -rf /home/runner/ncs.
      - name: Clean firmware build tree
        if: always()
        run: rm -rf build/native_sim

      - name: Run HTTP integration tests (spawned binary)
        run: cargo test --test http_integration --locked -- --test-threads=1

  release:
    name: Release
    needs: [nix-flake, build-test, native-sim]
    # Only a trusted push to main may reach the privileged release call. Pull
    # requests and other refs skip it, so PR-contributed content can never
    # trigger a publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      mode: release
      ref: ${{ github.sha }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: release
    # Same trusted gate as the release job; runs only after release succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.version }}

  notify-release-failure:
    name: Notify release pipeline failure
    needs: [release, publish-mcp-registry]
    # Runs on trusted main push only, after the release chain, whenever either
    # privileged call failed. always() keeps it alive when a dependency fails.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.release.result == 'failure' || needs.publish-mcp-registry.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          REGISTRY_RESULT: ${{ needs.publish-mcp-registry.result }}
        run: |
          set -euo pipefail
          # One stable issue per failure lineage: comment on the open
          # "[automation] Release pipeline failed" issue or create it. There is
          # no checkout, so GH_REPO pins the repository for gh. All dynamic
          # values arrive via env, never interpolated into the source.
          BODY="Release pipeline failed in run ${RUN_URL} at commit ${SHA}. release=${RELEASE_RESULT}, registry=${REGISTRY_RESULT}."
          OPEN=$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq 'map(select(.title == "[automation] Release pipeline failed"))[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "[automation] Release pipeline failed" --body "$BODY"
          fi
