name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix-flake:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # The build uses ~4-5 GB of store paths: 593 cargo dependencies, the
          # serial-mcp crate, the toolchain, and system libraries. The old 2G
          # cap evicted dependency and crate artifacts, causing a full ~14 min
          # rebuild on every cache hit. 8G retains build outputs for later
          # substitution instead of recompilation. This uses more of the
          # repository's 10 GB GitHub Actions cache quota.
          gc-max-store-size-linux: 8G

      # --print-build-logs (-L) keeps cargo and compiler output visible during
      # the build instead of leaving a silent multi-minute gap. This aids
      # flake and build failure diagnosis.
      - name: nix flake check
        run: nix flake check --accept-flake-config --print-build-logs

  build-test:
    name: build / test / clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          - os: ubuntu-24.04-arm
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
          # GitHub Actions uses macOS version labels here; macos-14 is Apple Silicon.
          - os: macos-14
            install: ""
          - os: windows-latest
            install: ""
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        if: matrix.os != 'windows-latest'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --all-targets
        run: cargo build --all-targets --locked

      - name: cargo test
        run: cargo test --locked

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Validate example configs against vendored schemas
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test config_schema_validation

      - name: Validate release and documentation consistency
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --locked --test doc_drift

      - name: Run registry manifest builder tests
        if: matrix.os == 'ubuntu-latest'
        run: python3 -m unittest discover -s scripts/tests -v

  mcp-conformance:
    # Run the official MCP conformance suite and Inspector interoperability
    # smoke against the real HTTP binary, plus the historical rmcp 1.7.0
    # client gate. scripts/test-mcp-compat.sh is the shared local and CI path.
    # It installs the lockfile-pinned validation tree from
    # compat/mcp-validation/package-lock.json, including exact
    # @modelcontextprotocol/conformance@0.2.0-alpha.10 and
    # @modelcontextprotocol/inspector@2.0.0 versions with integrity hashes, via
    # `npm ci --ignore-scripts`. Lifecycle scripts stay disabled; npx and
    # dynamic package resolution are not used. The script invokes local
    # node_modules/.bin binaries, owns exact protocol-version scenario sets,
    # uses no `--suite all`, and owns the expected-failure baseline and pinned
    # Inspector invocation. The four expected failures in
    # conformance/expected-failures.yaml cover fixture-dependent checks that
    # serial-mcp cannot satisfy. The product never adds fixture endpoints. A
    # baseline check that starts passing is stale and fails the job; any other
    # failure is an unexpected regression. Inspector is a separate
    # interoperability smoke using the exact pinned 2.0.0 CLI. This job owns
    # environment setup, the 15-minute bound, cleanup, and report upload.
    name: MCP conformance + Inspector smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node (exact pinned version)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.19.0"

      # The shared runner installs lockfile-pinned MCP validation tooling with
      # `npm ci --ignore-scripts` in compat/mcp-validation. Lifecycle scripts,
      # npx, and dynamic resolution stay disabled. It builds the locked binary,
      # runs focused Rust gates, builds and runs the historical rmcp 1.7.0
      # client over stdio and HTTP, starts a loopback server with bounded
      # readiness, runs the exact legacy and modern scenario sets through the
      # local conformance binary, and runs the Inspector smoke through the
      # local mcp-inspector binary. A trap stops the server and cleans the temp
      # directory on success, failure, signal, or timeout.
      - name: Run shared MCP compatibility gate
        run: bash scripts/test-mcp-compat.sh

      - name: Upload conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-results
          path: target/conformance-results/
          if-no-files-found: warn
          retention-days: 7
  native-sim:
    name: native_sim firmware + test
    runs-on: ubuntu-latest
    env:
      NCS_VERSION: v3.3.0
      NCS_INSTALL_DIR: /home/runner/ncs
      # Pin nrfutil core and sdk-manager versions and their checksums here.
      # The installer downloads only these versioned tarballs and verifies
      # SHA-256 before extraction. It never uses the unversioned launcher URL,
      # which returned an HTTP 504 HTML page and broke later nrfutil steps. See
      # firmware/AGENTS.md "CI nrfutil provisioning" for update procedure.
      NRFUTIL_VERSION: "8.2.0"
      NRFUTIL_SHA256: "fabe84198efe045a7cdcc9d5132669c1bc2cb168f61db93f2261ae4fd980e73f"
      NRFUTIL_SDK_MANAGER_VERSION: "1.16.1"
      NRFUTIL_SDK_MANAGER_SHA256: "d2fe97f143f888a679223d9c6e0b51d730eb60b4a5f4a5dafc970acd2020fe38"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # GitHub-hosted ubuntu-latest runners provide ~14 GB of free disk. The
      # NCS SDK and toolchain cache use ~4.6 GB, cargo uses ~1-2 GB, and the
      # image includes ~7 GB of unused dotnet, android, ghc, CodeQL, and
      # Docker content. Without this headroom native-sim can hit ENOSPC before
      # the runner writes its own _diag log. This step reclaims ~7 GB. Keep it
      # only with the df -h measurements below. See firmware/AGENTS.md "CI
      # disk pressure" for the full rationale.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo docker builder prune -a --force || true
          df -h /

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config gcc-multilib libusb-1.0-0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Cache NCS SDK and toolchain
        id: cache-ncs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/ncs
            /home/runner/.nrfutil
          key: ncs-${{ env.NCS_VERSION }}-v3

      # Provisioning is fail-closed, checksum-verified, and version-pinned.
      # The old flow downloaded an unversioned launcher into /usr/local/bin.
      # A CDN timeout installed a 160-byte HTTP 504 page, then later steps
      # floated core and sdk-manager versions through `nrfutil self-upgrade`
      # and `nrfutil install sdk-manager`. The installer downloads the exact
      # versioned tarballs from the job environment, verifies SHA-256 before
      # extraction, stages and verifies both binaries, then publishes the
      # destination. It uses no sudo, executes nothing before verification,
      # and cleans temporary files on failure. Offline tests cover this flow
      # with file:// fixtures and no network.
      - name: Run installer offline tests
        run: bash scripts/tests/test_install_nrfutil_ci.sh

      - name: Provision pinned nrfutil + sdk-manager
        run: |
          bash scripts/install-nrfutil-ci.sh "$RUNNER_TEMP/nrfutil"
          # Isolated NRFUTIL_HOME prevents stale command registrations restored
          # from /home/runner/.nrfutil by the cache from overriding pinned
          # binaries. GITHUB_PATH and GITHUB_ENV affect later steps only.
          mkdir -p "$RUNNER_TEMP/nrfutil-home"
          echo "$RUNNER_TEMP/nrfutil/bin" >> "$GITHUB_PATH"
          echo "NRFUTIL_HOME=$RUNNER_TEMP/nrfutil-home" >> "$GITHUB_ENV"

      # The first output line proves which binaries later steps use. It has a
      # per-build hash suffix, such as "nrfutil 8.2.0 (c910332 2026-04-21)",
      # so the check matches the pinned version prefix rather than the full
      # line. NRFUTIL_HOME isolation prevents cached registrations from
      # shadowing these binaries.
      - name: Verify pinned nrfutil + sdk-manager versions
        run: |
          set -euo pipefail
          case "$(nrfutil --version | head -n1)" in
            "nrfutil $NRFUTIL_VERSION "*) ;;
            "nrfutil $NRFUTIL_VERSION") ;;
            *) echo "unexpected nrfutil version: $(nrfutil --version | head -n1)" >&2; exit 1 ;;
          esac
          case "$(nrfutil-sdk-manager --version | head -n1)" in
            "nrfutil-sdk-manager $NRFUTIL_SDK_MANAGER_VERSION "*) ;;
            "nrfutil-sdk-manager $NRFUTIL_SDK_MANAGER_VERSION") ;;
            *) echo "unexpected nrfutil-sdk-manager version: $(nrfutil-sdk-manager --version | head -n1)" >&2; exit 1 ;;
          esac

      - name: Configure sdk-manager install directory
        run: nrfutil sdk-manager config install-dir set "$NCS_INSTALL_DIR"

      - name: Install NCS SDK and toolchain
        if: steps.cache-ncs.outputs.cache-hit != 'true'
        run: nrfutil sdk-manager install "$NCS_VERSION"

      - name: Report disk usage after NCS restore/install
        run: df -h /

      - name: Build native_sim firmware
        run: |
          eval "$(nrfutil sdk-manager toolchain env --ncs-version "$NCS_VERSION" --as-script sh)"
          export ZEPHYR_BASE="$NCS_INSTALL_DIR/$NCS_VERSION/zephyr"
          west build -b native_sim firmware/ -d build/native_sim --pristine -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Report disk usage after firmware build
        run: df -h /

      - name: Run native_sim tests
        env:
          SERIAL_MCP_NATIVE_SIM_BIN: build/native_sim/firmware/zephyr/zephyr.exe
        run: |
          cargo test --test native_sim_validation -- --ignored --test-threads=1
          cargo test --test native_sim_connection_lifecycle -- --ignored --test-threads=1

      # Remove the firmware build tree after tests so post-step cache upload
      # and later steps do not walk a stale directory. Keep /home/runner/ncs:
      # actions/cache@v6 saves it after the job, and a cache miss followed by a
      # skipped install would break the next run. Do not remove that path.
      - name: Clean firmware build tree
        if: always()
        run: rm -rf build/native_sim

      - name: Run HTTP integration tests (spawned binary)
        run: cargo test --test http_integration --locked -- --test-threads=1

  release:
    name: Release
    needs: [nix-flake, build-test, native-sim]
    # Only a trusted push to main reaches the privileged release call. Pull
    # requests and other refs skip it, so PR content cannot trigger a publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      mode: release
      ref: ${{ github.sha }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: release
    # Use the same trusted gate and run only after release succeeds.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.release.outputs.version }}

  notify-release-failure:
    name: Notify release pipeline failure
    needs: [release, publish-mcp-registry]
    # Run only on a trusted main push after the release chain when either
    # privileged call fails. always() keeps the notifier alive after dependency
    # failure.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.release.result == 'failure' || needs.publish-mcp-registry.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create or comment on release-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          RELEASE_RESULT: ${{ needs.release.result }}
          REGISTRY_RESULT: ${{ needs.publish-mcp-registry.result }}
        run: |
          set -euo pipefail
          # Keep one stable issue per failure lineage: comment on the open
          # "[automation] Release pipeline failed" issue or create it. There is
          # no checkout; GH_REPO selects the repository for gh. Dynamic values
          # arrive through the environment, not shell source interpolation.
          BODY="Release pipeline failed in run ${RUN_URL} at commit ${SHA}. release=${RELEASE_RESULT}, registry=${REGISTRY_RESULT}."
          OPEN=$(gh api "repos/${GH_REPO}/issues?state=open&per_page=100" \
            --jq 'map(select(.title == "[automation] Release pipeline failed"))[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "$BODY"
          else
            gh issue create --title "[automation] Release pipeline failed" --body "$BODY"
          fi
