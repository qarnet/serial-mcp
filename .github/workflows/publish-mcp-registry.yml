name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      ref:
        description: Trusted git ref, by branch, tag, or SHA, whose current scripts build the manifest
        required: true
        type: string
      version:
        description: Strict SemVer version to publish; it must have a published GitHub release v<version>
        required: true
        type: string

# mcp-publisher login github-oidc requires OIDC. No other secrets are needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    env:
      REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout current trusted ref
        # Fetch full history so `git show` can read the historical template as
        # data. Historical code is never executed.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Validate version
        # Validate the version before using it in any tag or path argument.
        run: python3 scripts/build_registry_manifest.py --validate-version-only "$VERSION"

      - name: Read historical template as data
        # Extract the template with `git show` into staging. It is JSON data,
        # never executable code.
        run: |
          set -euo pipefail
          rm -rf staging
          mkdir -p staging/assets
          git show "refs/tags/${TAG}:server.json" > staging/template-server.json

      - name: Verify published release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Only a published, non-draft release is eligible. The manifest
          # points to assets available after the release is sealed. gh release
          # view also fails when the tag is missing.
          DRAFT=$(gh release view "$TAG" --json isDraft -q '.isDraft')
          if [ "$DRAFT" != "false" ]; then
            echo "::error::release $TAG does not exist or is still a draft; refusing to publish."
            exit 1
          fi

      - name: Decide whether to publish
        id: gate
        run: |
          set -euo pipefail
          NAME=$(jq -r '.name' staging/template-server.json)
          # Do not publish a version already in the registry. A duplicate
          # returns HTTP 400, so reruns and unbumped merges must no-op.
          COUNT=$(curl -fsS --get \
            --data-urlencode "search=$NAME" \
            --data-urlencode "version=$VERSION" \
            https://registry.modelcontextprotocol.io/v0/servers \
            | jq -r '.metadata.count // 0')
          if [ "$COUNT" != "0" ]; then
            echo "$NAME@$VERSION already published to the MCP registry — skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$NAME@$VERSION not yet published — proceeding."
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Download exact platform assets into clean staging with
          # authentication. Do not use curl-to-hash pipelines. The builder
          # rechecks presence, regularity, size, and sha256 against GitHub
          # release metadata.
          gh release download "$TAG" --dir staging/assets --pattern 'serial-mcp-*'

      - name: Fetch release asset metadata
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/releases/tags/${TAG}" \
            --jq '{tag: .tag_name, assets: [.assets[] | {name, size, digest}]}' \
            > staging/release-metadata.json

      - name: Build server.json from validated assets
        if: steps.gate.outputs.publish == 'true'
        # The committed server.json is a template without a packages array.
        # This step alone produces package identifiers and sha256 hashes.
        # scripts/build_registry_manifest.py validates the version, template,
        # metadata, files, sizes, and digests before an atomic write.
        run: |
          set -euo pipefail
          python3 scripts/build_registry_manifest.py \
            --template staging/template-server.json \
            --version "$VERSION" \
            --metadata staging/release-metadata.json \
            --assets staging/assets \
            --output staging/server.json

      - name: Validate server.json against schema
        if: steps.gate.outputs.publish == 'true'
        # Use the independent jsonschema-cli flake package for schema
        # validation. Do not create the full project build environment.
        run: |
          set -euo pipefail
          # -f fails on HTTP errors, -sS keeps errors visible, and --retry
          # handles transient failures. A corrupted schema must fail the job,
          # not validate against a partial file.
          curl -fsSL --retry 3 --retry-all-errors \
            https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json \
            -o /tmp/mcp-server.schema.json
          nix shell .#jsonschema-cli --command \
            jsonschema-cli validate /tmp/mcp-server.schema.json -i staging/server.json

      - name: Login to MCP Registry (GitHub OIDC)
        if: steps.gate.outputs.publish == 'true'
        run: nix run .#mcp-publisher -- login github-oidc

      - name: Publish to MCP Registry
        if: steps.gate.outputs.publish == 'true'
        # mcp-publisher 1.7.9 takes the manifest as a positional path. It has
        # no --mcp-file flag and defaults to ./server.json. The staged path
        # keeps the committed server.json template untouched.
        run: nix run .#mcp-publisher -- publish staging/server.json
