name: Release

on:
  workflow_call:
    inputs:
      mode:
        description: 'Mode "release" creates and publishes a release, uploads assets, and publishes the crate. Mode "dry-run" builds the four platform binaries and uploads Actions artifacts.'
        required: true
        type: string
      ref:
        description: Git ref to build and release (branch, tag, or SHA)
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false
        description: crates.io publish token for release mode
    outputs:
      version:
        description: Package version prepared by the release, including when an already-published version is skipped
        value: ${{ jobs.prepare.outputs.version }}

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.meta.outputs.ref }}
      sha: ${{ steps.meta.outputs.sha }}
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Validate mode
        run: |
          # Reject unknown modes before any mutation.
          if [ "${{ inputs.mode }}" != "release" ] && [ "${{ inputs.mode }}" != "dry-run" ]; then
            echo "Invalid mode '${{ inputs.mode }}' — only 'release' and 'dry-run' are accepted." >&2
            exit 1
          fi

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve ref metadata
        id: meta
        run: |
          echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: |
          VER=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          echo "value=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Check for a published release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a published, non-draft release counts as already released. A
          # leftover draft from a failed run must remain retryable. Immutable
          # releases attach assets to the draft and seal it only on publish, so
          # an unpublished tag or draft is unfinished.
          if [ "$(gh release view "${{ steps.version.outputs.tag }}" \
                    --json isDraft -q .isDraft 2>/dev/null)" = "false" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate crates.io token present
        # Release mode must have its publish credential before mutation starts.
        # Dry-run callers pass no token and skip this check. Read the token only
        # through env; never print it.
        if: inputs.mode == 'release' && steps.tag.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required for release mode but is empty or not configured."
            exit 1
          fi

      - name: Decide mode
        id: mode
        run: |
          # The caller supplies the mode. A release call for an already-published
          # version becomes a no-op; dry-run always proceeds.
          if [ "${{ inputs.mode }}" = "release" ] && [ "${{ steps.tag.outputs.published }}" = "true" ]; then
            echo "mode=skip" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.mode != 'skip'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: serial-mcp
            artifact_name_suffix: x86_64-linux
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
            strip: strip
            linker: ""
            pkg_config_allow_cross: ""
            pkg_config_path: ""

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: serial-mcp
            artifact_name_suffix: aarch64-linux
            install: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
            strip: strip
            linker: ""
            pkg_config_allow_cross: ""
            pkg_config_path: ""

          # GitHub Actions uses macOS version labels here; macos-14 is Apple Silicon.
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: serial-mcp
            artifact_name_suffix: aarch64-macos
            install: ""
            strip: strip
            linker: ""
            pkg_config_allow_cross: ""
            pkg_config_path: ""

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: serial-mcp.exe
            artifact_name_suffix: x86_64-windows
            install: ""
            strip: ""
            linker: ""
            pkg_config_allow_cross: ""
            pkg_config_path: ""
    steps:
      - name: Checkout resolved ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install system dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Report Rust toolchain
        run: rustc --version --verbose

      # Cargo cache is RESTORED AND SAVED ONLY in release mode (CodeQL
      # actions/cache-poisoning/poisonable-step, alert #15). The untrusted
      # path is dry-run: its `ref` input is a workflow_dispatch value that
      # could point at attacker-controlled code, and the cache action's POST
      # step would tar whatever that code left in ~/.cargo/target and upload
      # it under the deterministic rust-cache key — poisoning the entry the
      # trusted release later restores. Release mode is only ever invoked by
      # the trusted CI gate with the immutable github.sha, so its cache
      # namespace is never written by untrusted code. Dry-run therefore gets
      # NO cache step at all (nothing to restore, nothing to poison); the
      # trusted release keeps its cache.
      - name: Cache cargo registry + build (release mode only)
        if: inputs.mode == 'release'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Configure cross-compilation environment
        if: matrix.linker != ''
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_ALLOW_CROSS=${{ matrix.pkg_config_allow_cross }}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${{ matrix.pkg_config_path }}" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: matrix.strip != ''
        run: ${{ matrix.strip }} target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Rename binary
        shell: bash
        run: |
          EXT="${{ matrix.artifact == 'serial-mcp.exe' && '.exe' || '' }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "serial-mcp-${{ matrix.artifact_name_suffix }}${EXT}"

      - name: Upload artifact
        # Name artifacts per platform. publish-release downloads these exact
        # names in release mode, and dry-run users see the same artifacts.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: serial-mcp-${{ matrix.artifact_name_suffix }}
          path: serial-mcp-${{ matrix.artifact_name_suffix }}*

  create-draft:
    name: Create draft release
    needs: prepare
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # Immutable-release rules prevent `git push` from creating the tag.
          # GitHub creates it when the release is published. The draft points
          # at the release commit; publish-release uploads assets and seals it.
          # A rerun after partial failure reuses the existing draft.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$SHA" \
              --draft \
              --title "$TAG" \
              --generate-notes
          fi

  publish-release:
    name: Publish GitHub release
    needs: [prepare, create-draft, build]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download x86_64-linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: serial-mcp-x86_64-linux
          path: artifacts/x86_64-linux

      - name: Download aarch64-linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: serial-mcp-aarch64-linux
          path: artifacts/aarch64-linux

      - name: Download aarch64-macos artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: serial-mcp-aarch64-macos
          path: artifacts/aarch64-macos

      - name: Download x86_64-windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: serial-mcp-x86_64-windows
          path: artifacts/x86_64-windows

      - name: Upload artifacts to draft
        # Upload exact matrix artifacts without executing them. The binaries
        # are passed to `gh release upload` by path only.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          for f in artifacts/*/*; do
            gh release upload "$TAG" "$f" --clobber
          done

      - name: Mark draft as published
        # Publishing the draft seals the release under immutable-release rules;
        # every platform binary is attached first.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "$TAG" \
            --draft=false \
            --latest

  publish-crate:
    name: Publish to crates.io
    needs: [prepare, build]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout resolved ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Skip if version already on crates.io
        id: crate_check
        run: |
          NAME=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].name')
          VERSION="${{ needs.prepare.outputs.version }}"
          # crates.io rejects an existing version. Treat it as a no-op so reruns
          # do not fail the release.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "User-Agent: ${NAME}-release-ci (github.com/qarnet/serial-mcp)" \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}")
          if [ "$CODE" = "200" ]; then
            echo "${NAME} ${VERSION} already on crates.io — skipping publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.crate_check.outputs.exists != 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
