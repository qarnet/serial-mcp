name: Hardening

# Scheduled and manual hardening only. This is not a PR gate. It runs a short
# fuzz smoke for each existing target and focused checksum/parser mutation
# tests with wall-clock bounds and failure artifact uploads. See
# docs/development/windows-serial-e2e-investigation.md and AGENTS.md
# "Hardening (scheduled)" for the full contract.
on:
  schedule:
    # Sunday at 06:00 UTC each week.
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: hardening
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: [tool_call_json, codec_roundtrip, clamp_bounds]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install pinned nightly toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-07-15

      # rust-toolchain.toml pins 1.97.1 and overrides `rustup default`.
      # Without this variable cargo fuzz would use stable and reject
      # -Zsanitizer=address ("the option `Z` is only accepted on the nightly
      # compiler").
      - name: Report Rust toolchain
        run: rustc --version --verbose
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-07-15

      - name: Cache cargo registry + fuzz build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz

      - name: Install pinned cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Fuzz ${{ matrix.target }} (5 min)
        working-directory: fuzz
        # Each target gets a 300s libFuzzer budget. GNU timeout 600s is the
        # outer cap, so a hung target fails instead of idling. The cap includes
        # the ~140s cold nightly build on a fresh runner. The old 360s cap
        # left about 3.5 min for fuzzing and exited 124 before the 300s budget.
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml so -Zsanitizer uses
        # nightly.
        run: timeout 600 cargo fuzz run "${{ matrix.target }}" -- -max_total_time=300
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-07-15

      - name: Upload fuzz artifacts and corpus
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}
            fuzz/corpus/${{ matrix.target }}
          # Missing paths warn and never mask the failed step's exit status.
          if-no-files-found: warn
          retention-days: 7

  mutate:
    name: mutation (checksums + parsers)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Report Rust toolchain
        run: rustc --version --verbose

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install pinned cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Mutate checksums + parsers
        # Scope is src/checksums.rs and src/framing/parsers/**. Baseline stays
        # enabled. Each mutant has 120s and four parallel jobs. cargo-mutants
        # defaults to one job; the old --jobs 2 made the 1500s cap unreachable:
        # 81 mutants at ~90s each over two jobs took about 61 min. Removing the
        # flag made it serial and slower. GNU timeout 2400s is the outer cap.
        # Missed or timed-out mutants fail the job; exit status is preserved.
        run: |
          timeout 2400 cargo mutants \
            --file src/checksums.rs \
            --file 'src/framing/parsers/**' \
            --cargo-arg=--locked \
            --timeout 120 \
            --jobs 4 \
            -- --lib

      - name: Upload mutants.out
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-out
          path: mutants.out
          # Output may be absent when failure occurs before it is produced.
          # Warn without masking the failed step's exit status.
          if-no-files-found: warn
          retention-days: 7
